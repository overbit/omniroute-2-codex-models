name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check proxy.js
      - run: docker build -t omniroute-2-codex-models:test .
      - name: Validate existing-container Compose overlay
        env:
          OMNIROUTE_DOCKER_NETWORK: ci-omniroute-network
        run: |
          docker compose -f compose.yaml -f compose.omniroute.yaml config --quiet
          docker compose -f compose.yaml -f compose.omniroute.yaml config | grep -F 'http://omniroute:20128/v1/models?prefix=alias'

name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - run: go test -race ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l main.go main_test.go)"
      - run: docker build -t omniroute-2-codex-models:test .
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Validate existing OmniRoute Docker network overlay if present
        env:
          OMNIROUTE_DOCKER_NETWORK: ci-omniroute-network
        run: |
          if [ -f compose.omniroute.yaml ]; then
            docker compose -f compose.yaml -f compose.omniroute.yaml config --quiet
            docker compose -f compose.yaml -f compose.omniroute.yaml config | grep -F 'http://omniroute:20128/v1/models?prefix=alias'
          fi
